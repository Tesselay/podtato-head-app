AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  practice-pha app secrets stack: the secret container for one app and environment,
  plus a policy to read it. The values are pushed with `make secrets`.

Parameters:
  AppName:
    Type: String
    Default: podtato-head
    AllowedPattern: "^[a-z0-9-]+$"
    Description: App that the secret belongs to; becomes the first part of the secret name.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Each environment gets its own stack and secret.

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Neither SecretString nor GenerateSecretString is set, so CloudFormation creates an empty secret and never sees, stores or overwrites the values. The name follows a fixed pattern (<app>/<env>/env), so the Makefile can find the secret without looking anything up.
    Properties:
      Name: !Sub ${AppName}/${Environment}/env
      Description: !Sub Environment variables for ${AppName} (${Environment}); values are set with make secrets
  AppSecretReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "Attach this to whatever runs the app. No KMS permission is needed: the AWS managed key lets Secrets Manager decrypt for callers in this account."
    Properties:
      Description: !Sub Read the ${AppName} (${Environment}) environment secret
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Ref AppSecret

Outputs:
  SecretsArn:
    Description: Full ARN of the secret
    Value: !Ref AppSecret
    Export:
      Name: !Sub ${AWS::StackName}-SecretsArn
  ReadPolicyArn:
    Description: Attach to whatever runs the app
    Value: !Ref AppSecretReadPolicy
    Export:
      Name: !Sub ${AWS::StackName}-AppSecretReadPolicy
