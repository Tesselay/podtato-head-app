AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  practice-pha service stack for one app: the task security group and its rules to and
  from the ALB, the target group and listener rule, the task definition and the ECS
  service. A release (new image digest) touches only this stack.

Parameters:
  ProjectName:
    Type: String
    Default: practice-pha
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefix for resource names.
  AppPort:
    Type: Number
    Default: 8080
    Description: >-
      Port the app listens on; the container, target group, health checks and security
      group rules all follow it.
  PathPattern:
    Type: String
    Default: "/*"
    Description: Requests whose path matches are forwarded to this service.
  ListenerRulePriority:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 50000
    Description: Unique per listener; lower numbers are evaluated first.
  AppComponents:
    Type: String
    Description: App specific env var for the components to be rendered.
    Default: all
    AllowedValues: [all, leftArm, rightArm, leftLeg, rightLeg]
  AppStartupDelay:
    Type: String
    Description: App specific env var to delay runtime startup.
    Default: "0s"
  DesiredCount:
    Type: Number
    Default: 2
    Description: Baseline number of tasks in ECS service.
  RepositoryURI:
    Type: String
    Description: >-
      URI of the app's ECR repository; the Makefile builds it from the registry stack's
      RegistryURI output.
  ImageDigest:
    Type: String
    AllowedPattern: "^sha256:[a-f0-9]{64}$"
    Description: Image digest as sourced from invocation.
  AvailabilityZones:
    Type: CommaDelimitedList
    Description: AZs the service runs in; sourced from network stack
  NetworkStackName:
    Type: String
    Description: Name of the stack deployed from cf-network.yaml
  IngressStackName:
    Type: String
    Description: Name of the stack deployed from cf-ingress.yaml
  ClusterStackName:
    Type: String
    Description: Name of the stack deployed from cf-cluster.yaml
  SecretsStackName:
    Type: String
    Description: Name of the stack deployed from cf-secrets.yaml
  AlertsStackName:
    Type: String
    Description: Name of the stack deployed from cf-alerts.yaml

Transform: AWS::LanguageExtensions
Resources:
  # ----- Task Connectivity ------------------------------------------------------------
  SecurityGroupECSTask:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        trust:
          src: infer
          conf: low
          note: "rationale not documented"
    Properties:
      GroupDescription: Security group for the network interfaces of the practice project app tasks (awsvpc).
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS calls made by the app itself
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sg-task
  SecurityGroupELBHealthChecksIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS service stack owns SG rules required for its tasks to communicate since they only make sense in context of the service.
    Properties:
      GroupId: !GetAtt SecurityGroupECSTask.GroupId
      SourceSecurityGroupId:
        Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      Description: App traffic and health checks from the ALB
  SecurityGroupELBHealthChecksEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS service stack owns SG rules required for its tasks to communicate since they only make sense in context of the service.
    Properties:
      GroupId:
        Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerSecurityGroupId
      DestinationSecurityGroupId: !GetAtt SecurityGroupECSTask.GroupId
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      Description: App traffic and health checks to the tasks

  # ----- Attachment to the load balancer ----------------------------------------------
  ELBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS service stack owns target group configuration required for traffic to be distributed to tasks since it only make sense in context of the service.
    Properties:
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckProtocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-tg
  ELBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS service stack owns listener configuration required for traffic to be distributed to tasks since it only make sense in context of the service.
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${IngressStackName}-ListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Ref PathPattern
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ELBTargetGroup

  # ----- Task Definition --------------------------------------------------------------
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        trust:
          src: infer
          conf: low
          note: "rationale not documented"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - Fn::ImportValue: !Sub ${SecretsStackName}-AppSecretReadPolicy
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Non-sensitive env vars are defined here for simplicity.
    Properties:
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
        - Name: !Ref ProjectName
          Image: !Sub ${RepositoryURI}@${ImageDigest}
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref AppPort
            - Name: PODTATO_COMPONENT
              Value: !Ref AppComponents
            - Name: PODTATO_STARTUP_DELAY
              Value: !Ref AppStartupDelay
          Secrets:
            - Name: PODTATO_SECRET_MESSAGE
              ValueFrom: !Sub
                - "${ARN}:PODTATO_SECRET_MESSAGE::"
                - ARN:
                    Fn::ImportValue: !Sub ${SecretsStackName}-SecretsArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        trust:
          src: infer
          conf: low
          note: "rationale not documented"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 7

  # ----- Service ----------------------------------------------------------------------
  ECSService:
    Type: AWS::ECS::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: "Dependencies:
          - ELBListenerRule: ECS only accepts a target group that is already attached to a load balancer, and the listener rule is what attaches this one.
          - The two security group rules: the first tasks must be reachable for their health checks, and on delete the service and its tasks go before the rules do."
    DependsOn:
      - ELBListenerRule
      - SecurityGroupELBHealthChecksIngress
      - SecurityGroupELBHealthChecksEgress
    Properties:
      Cluster:
        Fn::ImportValue: !Sub ${ClusterStackName}-ClusterName
      TaskDefinition: !Ref ECSTaskDefinition
      CapacityProviderStrategy:
        - CapacityProvider:
            Fn::ImportValue: !Sub ${ClusterStackName}-CapacityProviderName
          Weight: 1
      SchedulingStrategy: REPLICA
      DesiredCount: !Ref DesiredCount
      LoadBalancers:
        - ContainerName: !Ref ProjectName
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref ELBTargetGroup
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !GetAtt SecurityGroupECSTask.GroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${NetworkStackName}-AppSubnetIds
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: ECS
      ServiceConnectConfiguration:
        Enabled: false
      EnableECSManagedTags: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ecs-service

  # ----- Monitoring -------------------------------------------------------------------
  AlarmELBHealthyHosts:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: No reported healthy target would be critical.
        must:
          - TreatMissingData as breaching because no data means no target is registered.
    DependsOn: ECSService
    Properties:
      AlarmName: !Sub "CRITICAL: ${AWS::StackName}-AlarmELBHealthyHosts"
      AlarmDescription: No healthy targets (tasks) in target group
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: LoadBalancer
          Value: 
            Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ELBTargetGroup.TargetGroupFullName
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn

  'Fn::ForEach::AvailabilityZonesLoop':
    - AvailabilityZone
    - !Ref AvailabilityZones
    - 'AlarmELBHealthyHosts&{AvailabilityZone}':
        Type: AWS::CloudWatch::Alarm
        Metadata:
          com.aws.cloudformation.Context:
            why: Alerts about loss of redundancy; not necessarily critical but still important.
            must:
              - TreatMissingData as breaching because no data means no target is registered.
              - Evaluation done over 3 minutes to give ECS time to start a task.
        DependsOn: ECSService
        Properties:
          AlarmName: !Sub "WARNING: ${AWS::StackName}-AlarmELBHealthyHosts-${AvailabilityZone}"
          AlarmDescription: !Sub "No healthy targets (tasks) in target group of ${AvailabilityZone}"
          Namespace: AWS/ApplicationELB
          MetricName: HealthyHostCount
          Statistic: Minimum
          Period: 60
          EvaluationPeriods: 3
          DatapointsToAlarm: 3
          Threshold: 1
          ComparisonOperator: LessThanThreshold
          TreatMissingData: breaching
          Dimensions:
            - Name: LoadBalancer
              Value: 
                Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerFullName
            - Name: TargetGroup
              Value: !GetAtt ELBTargetGroup.TargetGroupFullName
            - Name: AvailabilityZone
              Value: !Sub "${AvailabilityZone}"
          AlarmActions:
            - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
          OKActions: 
            - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      
  AlarmELBTargetsServerErrors:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Too many HTTP server errors indicate tasks or hosts are unhealthy.
        must: 
          - TreatMissingData as notBreaching as no data means no error. ignore would keep state of last traffic, which is misleading. A "no traffic" incident is handled by healthy hosts alarm. 
    DependsOn: ECSService
    Properties:
      AlarmName: !Sub "CRITICAL: ${AWS::StackName}-AlarmELBTargetsServerErrors"
      AlarmDescription: Number of HTTP server errors across number of requests to targets.
      Metrics:
        - Id: error_percentage
          Label: "Error count over requests"
          ReturnData: true
          Expression: 100*(errors/requests)
        - Id: errors
          Label: "Input 5XX errors"
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: TargetGroup
                  Value: !GetAtt ELBTargetGroup.TargetGroupFullName
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerFullName
            Stat: Sum
            Period: 60
        - Id: requests
          Label: "Input request count"
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: TargetGroup
                  Value: !GetAtt ELBTargetGroup.TargetGroupFullName
                - Name: LoadBalancer
                  Value:
                    Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerFullName
            Stat: Sum
            Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
  
  AlarmELBTargetResponseTime:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: App is lightweight, high response time means something is wrong.
        must:
          - TreatMissingData as notBreaching since no data means no requests.
          - EvaluateLowSampleCountPercentile as evaluate since the app gets low traffic.
    DependsOn: ECSService
    Properties:
      AlarmName: !Sub "WARNING: ${AWS::StackName}-AlarmELBTargetResponseTime"
      AlarmDescription: Targets response time exceeds threshold.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      ExtendedStatistic: p95
      EvaluateLowSampleCountPercentile: evaluate
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: 
            Fn::ImportValue: !Sub ${IngressStackName}-LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ELBTargetGroup.TargetGroupFullName
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn

  AlarmECSMemoryUtilization:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Tasks should scale before reaching too high memory utilization.
        must:
          - TreatMissingData as notBreaching, no data might indicate something being wrong but there are other alarms for task availability issues
    Properties:
      AlarmName: !Sub "WARNING: ${AWS::StackName}-AlarmECSMemoryUtilization"
      AlarmDescription: Memory utilization of tasks is too high
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ClusterName
          Value: 
            Fn::ImportValue: !Sub ${ClusterStackName}-ClusterName
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn

  AlarmECSCPUUtilization:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Tasks should scale before reaching too high CPU utilization.
        must:
          - TreatMissingData as notBreaching, no data might indicate something being wrong but there are other alarms for task availability issues
    Properties:
      AlarmName: !Sub "WARNING: ${AWS::StackName}-AlarmECSCPUUtilization"
      AlarmDescription: CPU utilization of tasks is too high
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ClusterName
          Value: 
            Fn::ImportValue: !Sub ${ClusterStackName}-ClusterName
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn

  AlarmECSRunningTaskCount:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: There should always be a minimum of tasks running
        must:
          - TreatMissingData as breaching since missing data would indicate tasks not being available, which this alarm monitors
    Properties:
      AlarmName: !Sub "WARNING: ${AWS::StackName}-AlarmECSRunningTaskCount"
      AlarmDescription: Less tasks than the minimum are running
      Namespace: ECS/containerInsights
      MetricName: RunningTaskCount
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: !Ref DesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: ClusterName
          Value: 
            Fn::ImportValue: !Sub ${ClusterStackName}-ClusterName
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn
      OKActions: 
        - Fn::ImportValue: !Sub ${AlertsStackName}-AlertTopicArn

Outputs:
  ELBTargetGroup:
    Description: For make smoke-test-target-group.
    Value: !Ref ELBTargetGroup
